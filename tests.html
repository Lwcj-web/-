<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinGuard 安全引擎测试报告</title>
<style>
:root{--ink:#0d1526;--sub:#6b7a99;--line:#e3e8f0;--bg:#f5f7fa;--ok:#0f9d58;--bad:#c9302c;--mono:ui-monospace,Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding:36px 24px;font-size:14px;line-height:1.6}
.w{max-width:1060px;margin:0 auto}
h1{font-size:20px;font-weight:600;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13px;margin:4px 0 22px}
.sum{display:flex;gap:12px;margin-bottom:20px}
.sum>div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;flex:1}
.sum .k{font-size:11.5px;color:var(--sub);letter-spacing:.3px}
.sum .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.panel h2{font-size:12.5px;font-weight:600;padding:11px 16px;border-bottom:1px solid var(--line);background:#fbfcfe;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:8px 16px;border-bottom:1px solid #f2f5fa;vertical-align:top}
tr:last-child td{border-bottom:none}
.st{font-weight:600;font-size:11px;padding:1px 8px;border-radius:5px;white-space:nowrap;letter-spacing:.3px}
.pass{background:#e8f6ee;color:var(--ok)} .fail{background:#fbeeed;color:var(--bad)}
.msg{font-family:var(--mono);font-size:11.5px;color:var(--bad);margin-top:3px}
.foot{margin-top:18px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="w">
  <h1>FinGuard 安全引擎测试报告</h1>
  <div class="sub">与命令行 <code>node tests/run.js</code> 共用同一份用例定义（tests/testcases.js），保证浏览器演示与 CI 回归结论一致。</div>
  <div class="sum" id="sum"></div>
  <div id="out"></div>
  <div class="foot">全部用例覆盖 L1 注入防御 → L2 意图解析 → L3 权限分级 → L4 幻觉防护 → L5 双智能体 → 审计链 → 端到端管线</div>
</div>

<script src="src/engine.js"></script>
<script src="src/data.js"></script>
<script src="tests/testcases.js"></script>
<script>
run();
const cases = results.filter(r => r.type === 'case');
const passed = cases.filter(r => r.ok).length;
const failed = cases.length - passed;

document.getElementById('sum').innerHTML = `
  <div><div class="k">用例总数</div><div class="v">${cases.length}</div></div>
  <div><div class="k">通过</div><div class="v" style="color:var(--ok)">${passed}</div></div>
  <div><div class="k">失败</div><div class="v" style="color:${failed ? 'var(--bad)' : 'var(--sub)'}">${failed}</div></div>
  <div><div class="k">通过率</div><div class="v">${(passed / cases.length * 100).toFixed(1)}%</div></div>`;

let html = '';
for (const r of results) {
  if (r.type === 'group') html += `<div class="panel"><h2>${r.group}</h2><table>`;
  else html += `<tr><td style="width:64px"><span class="st ${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</span></td>
    <td>${r.name}${r.msg ? `<div class="msg">${r.msg}</div>` : ''}</td></tr>`;
  if (r.type === 'case' && results[results.indexOf(r) + 1]?.type === 'group') html += '</table></div>';
}
if (!html.endsWith('</div>')) html += '</table></div>';
document.getElementById('out').innerHTML = html;
</script>
</body>
</html>
